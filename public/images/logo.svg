<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="sysGlobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088dd"/>
      <stop offset="100%" stop-color="#0055a5"/>
    </linearGradient>
    <linearGradient id="sysOrbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
  </defs>
  
  <!-- Modern Geometric Telecom Emblem -->
  <g transform="translate(5, 5)">
    <!-- Tech Hexagon/Tower Core -->
    <circle cx="28" cy="28" r="24" stroke="url(#sysGlobeGrad)" stroke-width="2.5" fill="none" opacity="0.4"/>
    <!-- Orbiting Swirl / Signal waves -->
    <path d="M 6 36 C 14 10, 42 12, 50 24 C 44 46, 16 48, 10 32" stroke="url(#sysOrbitGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Central Node -->
    <circle cx="28" cy="28" r="7" fill="url(#sysGlobeGrad)"/>
    <circle cx="28" cy="28" r="3" fill="#ffffff"/>
    <circle cx="48" cy="20" r="3.5" fill="#ff7a00"/>
    <!-- Broadcast rays -->
    <path d="M 28 8 L 28 14 M 42 14 L 38 18 M 14 14 L 18 18" stroke="url(#sysGlobeGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography with adaptive CSS variables -->
  <!-- "SYS" in primary navy/white, "INFRA" in brand electric blue -->
  <g transform="translate(75, 42)">
    <text x="0" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" class="logo-sys">SYS</text>
    <text x="68" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#0070ba" class="logo-infra">INFRA</text>
  </g>

  <!-- Tagline: "Solutions Private Limited" -->
  <g transform="translate(76, 58)">
    <text x="0" y="0" font-family="'IBM Plex Sans', -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.2" class="logo-sub" text-transform="uppercase">SOLUTIONS PRIVATE LIMITED</text>
  </g>

  <style>
    .logo-sys { fill: #0b2545; transition: fill 0.3s ease; }
    .logo-sub { fill: #64748b; transition: fill 0.3s ease; }
    :root.dark .logo-sys, body.dark .logo-sys { fill: #ffffff; }
    :root.dark .logo-sub, body.dark .logo-sub { fill: #94a3b8; }
    :root.dark .logo-infra, body.dark .logo-infra { fill: #38bdf8; }
  </style>
</svg>
