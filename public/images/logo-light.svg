<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" fill="none" width="100%" height="100%">
  <!-- Left Circular Emblem (Scale & Center at (70, 70)) -->
  <g transform="translate(4, 0)">
    <!-- Outer Double Ring -->
    <circle cx="70" cy="70" r="66" stroke="#1e1b4b" stroke-width="4.5" fill="none" />
    <circle cx="70" cy="70" r="61" stroke="#1e1b4b" stroke-width="1.5" fill="none" opacity="0.6" />

    <!-- Top Banner Section -->
    <path d="M 22 45 L 118 45" stroke="#1e1b4b" stroke-width="2.5" />
    <text x="70" y="36" fill="#1e1b4b" font-family="'Space Grotesk', 'IBM Plex Sans', -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="3.5">SYSTEM</text>
    <text x="103" y="27" fill="#1e1b4b" font-family="sans-serif" font-size="7" font-weight="700">®</text>

    <!-- Central Bold Stylized S -->
    <g id="center-s">
      <path d="M 88 52 C 76 50, 48 53, 48 64 C 48 74, 88 71, 88 85 C 88 96, 60 97, 46 92 L 44 100 C 60 106, 98 104, 98 84 C 98 71, 58 74, 58 63 C 58 56, 76 56, 88 59 Z" fill="#dc2626" />
      <!-- INFRA text inside S -->
      <rect x="52" y="69" width="36" height="11" rx="2" fill="#dc2626" opacity="0.95" />
      <text x="70" y="78" fill="#ffffff" font-family="'IBM Plex Sans', sans-serif" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="1.5">INFRA</text>
    </g>

    <!-- Intersecting Orbital Rings -->
    <ellipse cx="70" cy="74" rx="46" ry="17" stroke="#2563eb" stroke-width="2" fill="none" transform="rotate(-23 70 74)" />
    <ellipse cx="70" cy="74" rx="46" ry="17" stroke="#2563eb" stroke-width="2" fill="none" transform="rotate(23 70 74)" />

    <!-- Satellite Electron Nodes -->
    <circle cx="28" cy="56" r="3.2" fill="#dc2626" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="112" cy="56" r="3.2" fill="#dc2626" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="28" cy="92" r="3.2" fill="#dc2626" stroke="#ffffff" stroke-width="0.8" />
    <circle cx="112" cy="92" r="3.2" fill="#dc2626" stroke="#ffffff" stroke-width="0.8" />

    <!-- Bottom Banner Section -->
    <path d="M 22 103 L 118 103" stroke="#1e1b4b" stroke-width="2.5" />
    <text x="70" y="117" fill="#1e1b4b" font-family="'Space Grotesk', 'IBM Plex Sans', -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle" letter-spacing="2.8">SOLUTIONS</text>
  </g>

  <!-- Right Typography Group -->
  <g transform="translate(162, 0)">
    <!-- Primary Brand Wordmark: "System Infra Solutions" -->
    <text x="0" y="74" fill="#0f172a" font-family="'Space Grotesk', 'IBM Plex Sans', -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.8">System Infra Solutions</text>
    
    <!-- "Pvt. Ltd." Suffix -->
    <text x="502" y="74" fill="#334155" font-family="'Space Grotesk', 'IBM Plex Sans', -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="0">Pvt. Ltd.</text>

    <!-- Full-Width Horizontal Architectural Baseline -->
    <line x1="0" y1="88" x2="590" y2="88" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />

    <!-- Tagline: "Solutions for life time..." right-aligned -->
    <text x="590" y="114" fill="#1e3a8a" font-family="'IBM Plex Sans', Georgia, serif" font-size="23" font-weight="700" font-style="italic" text-anchor="end" letter-spacing="0.4">Solutions for life time...</text>
  </g>
</svg>